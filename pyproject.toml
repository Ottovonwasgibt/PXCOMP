[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxcomp"
version = "0.3.0"
description = "Deterministic equal-share photographic pixel compositor"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "PXCOMP"}]
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "PySide6>=6.8,<7",
  "rawpy>=0.27,<1",
  "tifffile>=2025.6",
  "psd-tools>=1.18,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]
build = ["pyinstaller>=6.14,<7"]

[project.scripts]
pxcomp = "pxcomp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
